<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tugas 6 CSS Flexbox Layout</title>
    <style>
      * {
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        margin: 0;
        background-color: #f4f7f6;
        color: #333;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      .header {
        background-color: #2c3e50;
        padding: 30px;
        text-align: center;
        color: white;
        font-size: 24px;
      }

      .identitas {
        font-size: 14px;
        margin-top: 10px;
        color: #bdc3c7;
      }

      .row {
        display: flex;
        flex: 1;
        flex-wrap: wrap;
      }

      .column {
        flex: 1;
        padding: 20px;
        text-align: center;
        border: 1px solid #ddd;
        min-width: 200px;
      }

      .col-1 {
        background-color: #ecf0f1;
      }
      .col-2 {
        background-color: #d5dbdb;
      }
      .col-3 {
        background-color: #ecf0f1;
      }
      .col-4 {
        background-color: #d5dbdb;
      }

      .column h2 {
        color: #2980b9;
      }

      .footer {
        background-color: #34495e;
        padding: 20px;
        text-align: center;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>HEADER</h1>
      <div class="identitas">
        Ahmad Radhitya Maulana Marpaung | NIM: 2500018088 <br />
        Informatika - Universitas Ahmad Dahlan
      </div>
    </div>

    <div class="row">
      <div class="column col-1">
        <h2>KOLOM 1</h2>
        <p>Informasi Sidebar Kiri</p>
      </div>
      <div class="column col-2">
        <h2>KOLOM 2</h2>
        <p>Konten Utama Bagian A</p>
      </div>
      <div class="column col-3">
        <h2>KOLOM 3</h2>
        <p>Konten Utama Bagian B</p>
      </div>
      <div class="column col-4">
        <h2>KOLOM 4</h2>
        <p>Informasi Sidebar Kanan</p>
      </div>
    </div>

    <div class="footer">
      <h3>FOOTER</h3>
      <p>&copy; 2026 Pemrograman Web - Teknik Informatika UAD</p>
    </div>
  </body>
</html>
